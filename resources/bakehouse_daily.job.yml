# =============================================================================
# bakehouse_daily: daily orchestration of the medallion pipeline
# Source of truth for the job definition (deployed with Databricks Asset Bundles).
# =============================================================================
resources:
  jobs:
    bakehouse_daily:
      name: bakehouse_daily
      description: |
        Daily medallion pipeline for the Bakehouse lakehouse.
        Loads incremental sales and full-load master data (customers, franchises)
        through bronze -> silver -> gold (Kimball star schema with SCD2 customers).
        Audit log: workspace.ops.pipeline_runs (filter by job_run_id).
        Data quality: workspace.ops.data_quality_issues.
        Owner: Tomás Reyna.

      tags:
        project: bakehouse
        domain: sales
        env: dev
        owner: tomas.reyna
        cost_center: data-platform

      # --- Run behaviour -------------------------------------------------------
      max_concurrent_runs: 1        # watermark-based loads must never overlap
      queue:
        enabled: true               # a run triggered while another is active waits
      timeout_seconds: 2700         # whole job: 45 min
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 1200             # whole job: warn after 20 min
      performance_target: STANDARD  # nightly batch: cost over start-up latency

      email_notifications:
        on_failure:
          - ${var.notification_email}                    # defined per target in databricks.yml
        on_duration_warning_threshold_exceeded:
          - ${var.notification_email}

      schedule:
        quartz_cron_expression: 0 30 2 * * ?             # every day at 02:30
        timezone_id: Europe/Madrid
        pause_status: PAUSED                             # paused in dev

      parameters:
        - name: catalog
          default: workspace
        - name: job_run_id
          default: "{{job.run_id}}"

      # --- Code and runtime ------------------------------------------------------
      git_source:
        git_url: https://github.com/treynanovillo/databricks-bakehouse-lakehouse
        git_provider: gitHub
        git_branch: main

      environments:
        - environment_key: Default
          spec:
            environment_version: "6"                     # pinned for reproducibility

      # --- Tasks -------------------------------------------------------------------
      # Retry policy: bronze 2 retries (schema evolution restarts), others 1.
      # Every task: 2 min between retries, 30 min timeout, warning after 15 min.
      tasks:
        - task_key: bronze_transactions
          notebook_task:
            notebook_path: src/02_bronze
            source: GIT
          environment_key: Default
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 1800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 900

        - task_key: bronze_master_data
          notebook_task:
            notebook_path: src/02_bronze_master_data
            source: GIT
          environment_key: Default
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 1800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 900

        - task_key: silver_transactions
          depends_on:
            - task_key: bronze_transactions
          notebook_task:
            notebook_path: src/03_silver_transactions
            source: GIT
          environment_key: Default
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 1800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 900

        - task_key: silver_master_data
          depends_on:
            - task_key: bronze_master_data
          notebook_task:
            notebook_path: src/03_silver_master_data
            source: GIT
          environment_key: Default
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 1800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 900

        - task_key: gold_dimensions
          depends_on:
            - task_key: silver_transactions
            - task_key: silver_master_data
          notebook_task:
            notebook_path: src/04_gold_dimensions
            source: GIT
          environment_key: Default
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 1800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 900

        - task_key: gold_fact_sales
          depends_on:
            - task_key: gold_dimensions
          notebook_task:
            notebook_path: src/04_gold_fact_sales
            source: GIT
          environment_key: Default
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 1800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 900