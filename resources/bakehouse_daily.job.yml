# =============================================================================
# bakehouse_daily: daily orchestration of the medallion pipeline
# Notebook paths are relative to this file; the bundle uploads the code.
# =============================================================================
resources:
  jobs:
    bakehouse_daily:
      name: bakehouse_daily
      description: |
        Daily medallion pipeline for the Bakehouse lakehouse.
        Loads incremental sales and full-load master data (customers, franchises)
        through bronze -> silver -> gold (Kimball star schema with SCD2 customers),
        then runs data smoke tests.
        Audit log: ops.pipeline_runs (filter by job_run_id).
        Data quality: ops.data_quality_issues.
        Owner: Tomás Reyna.

      tags:
        project: bakehouse
        domain: sales
        env: ${bundle.target}
        owner: tomas.reyna
        cost_center: data-platform

      # --- Run behaviour -------------------------------------------------------
      max_concurrent_runs: 1        # watermark-based loads must never overlap
      queue:
        enabled: true               # a run triggered while another is active waits
      timeout_seconds: 2700         # whole job: 45 min
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 1200             # whole job: warn after 20 min
      performance_target: STANDARD  # nightly batch: cost over start-up latency

      email_notifications:
        on_failure:
          - ${var.notification_email}
        on_duration_warning_threshold_exceeded:
          - ${var.notification_email}

      schedule:
        quartz_cron_expression: 0 30 2 * * ?             # every day at 02:30
        timezone_id: Europe/Madrid
        pause_status: PAUSED                             # unpaused by the prod target

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: job_run_id
          default: "{{job.run_id}}"

      environments:
        - environment_key: Default
          spec:
            environment_version: "6"                     # pinned for reproducibility

      # --- Tasks -------------------------------------------------------------------
      # Load tasks: 2 min between retries, 30 min timeout, warning after 15 min.
      # Bronze gets 2 retries (schema evolution restarts the stream once).
      # Smoke tests never retry: a failed data check gives the same result again.
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/02_bronze.py
          environment_key: Default
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 1800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 900

        - task_key: silver_transactions
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/03_silver_transactions.py
          environment_key: Default
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 1800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 900

        - task_key: silver_master_data
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/03_silver_master_data.py
          environment_key: Default
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 1800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 900

        - task_key: gold_dimensions
          depends_on:
            - task_key: silver_transactions
            - task_key: silver_master_data
          notebook_task:
            notebook_path: ../src/04_gold_dimensions.py
          environment_key: Default
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 1800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 900

        - task_key: gold_fact_sales
          depends_on:
            - task_key: gold_dimensions
          notebook_task:
            notebook_path: ../src/04_gold_fact_sales.py
          environment_key: Default
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 1800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 900

        - task_key: smoke_tests
          depends_on:
            - task_key: gold_fact_sales
          notebook_task:
            notebook_path: ../src/99_smoke_tests.py
          environment_key: Default
          max_retries: 0
          timeout_seconds: 600